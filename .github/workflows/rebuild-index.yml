name: Rebuild Problem Index

on:
  push:
    branches:
      - main

jobs:
  rebuild-index:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rebuild index
        run: python .claude/hooks/build_index.py

      - name: Commit updated index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/index.md docs/index.csv
          git diff --staged --quiet || git commit -m "chore: rebuild problem index [skip ci]"
          git push
