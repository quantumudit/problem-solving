[project]
name = "problem-solving"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "altair>=6.3.0",
    "duckdb>=1.5.3",
    "faiss-cpu>=1.15.1",
    "flashrank>=0.2.10",
    "ipykernel>=7.2.0",
    "langchain-cohere>=0.6.0",
    "langchain-community>=0.4.2",
    "langchain-core>=1.6.12",
    "langchain-docling>=3.0.0",
    "langchain-openai>=1.7.2",
    "langchain-tavily>=0.2.18",
    "langchain-text-splitters>=1.1.3",
    "langgraph>=1.2.16",
    "marimo>=0.25.1",
    "matplotlib>=3.11.0",
    "pandas>=3.0.3",
    "polars>=1.41.2",
    "pyarrow>=24.0.0",
    "pydantic>=2.14.1",
    "pypdf>=6.21.1",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "rank-bm25>=0.2.2",
    "rich>=15.0.0",
    "ruff>=0.15.16",
    "seaborn>=0.13.2",
    "typer>=0.26.7",
